[ui.colors]
"selected" = { bg = "#20354a" }

[[actions]]
name = "diffview"
lua = '''
local rev = jjui.context.change_id()
if not rev then
    rev = jjui.context.commit_id()
end
if not rev then
    jjui.flash({ text = "No revision selected", error = true })
    return
end

local empty = jjui.jj({ "log", "-r", rev, "-T", "empty", "--no-graph" })
if empty == "true" then
    jjui.flash({ text = "Change is empty", error = true })
    return
end

local args
local file = jjui.context.file()
if jjui.jj({ "log", "-r", rev, "-T", "immutable", "--no-graph" }) == "true" then
    args = { "diff", "-r", rev, "--tool", "diffview" }
elseif jjui.jj({ "log", "-r", rev, "-T", "conflict", "--no-graph" }) == "true" then
    args = { "resolve", "-r", rev, "--tool", "diffview" }
else
    args = { "diffedit", "-r", rev, "--tool", "diffview" }
end

if file then
    args[#args + 1] = "--"
    args[#args + 1] = file
end
jjui.jj_interactive(args)
'''

[[actions]]
name = "forget_workspace"
lua = '''
local rev = jjui.context.change_id()
if not rev then
    rev = jjui.context.commit_id()
end
if not rev then
    jjui.flash({ text = "No revision selected", error = true })
    return
end

local template =
    'working_copies.map(|w| w.name() ++ "\\t" ++ w.root() ++ "\\n")'
local output = jjui.jj({ "log", "-r", rev, "-T", template, "--no-graph" })
if output == "" then
    jjui.flash({ text = "No workspace for selected change", error = true })
    return
end

for line in output:gmatch("[^\n]+") do
    local name, root = line:match("^([^\t]+)\t(.+)$")
    if name and root then
        jjui.jj({ "workspace", "forget", "--", name })
        jjui.jj({ "util", "exec", "--", "rm", "-rf", "--", root })
    end
end

jjui.flash({ text = "Workspace forgotten and deleted" })
jjui.revisions.refresh({ keep_selections = false })
'''

[[actions]]
name = "copy_change_id"
lua = '''
local rev = jjui.context.change_id()
if not rev then
    rev = jjui.context.commit_id()
end
if not rev then
    jjui.flash({ text = "No revision selected", error = true })
    return
end

local id = jjui.jj({
    "log",
    "-r",
    rev,
    "-T",
    "change_id.shortest(32)",
    "--no-graph",
})
local encoded = jjui.jj({
    "util",
    "exec",
    "--",
    "sh",
    "-c",
    'printf %s "$1" | base64 -w0',
    "",
    id,
})
if encoded == "" then
    jjui.flash({ text = "Could not encode change ID", error = true })
    return
end
io.write(string.char(27) .. "]52;c;" .. encoded .. string.char(7))
io.flush()
jjui.flash({ text = "Copied change ID " .. id })
'''

[[actions]]
name = "refresh"
lua = '''
local output = jjui.jj({
    "workspace",
    "list",
    "--no-pager",
    "-T",
    'name ++ "\\t" ++ root ++ "\\n"',
})
for line in output:gmatch("[^\n]+") do
    local name, root = line:match("^([^\t]+)\t(.+)$")
    if name and root then
        jjui.jj({ "-R", root, "util", "snapshot", "--no-pager" })
    end
end
jjui.revisions.refresh({ keep_selections = true })
'''

[[actions]]
name = "up"
lua = '''
local cmd = { "log", "-r", "trunk()", "-T", "remote_bookmarks", "--no-graph" }
local trunk = jjui.jj(cmd):match("^([^@]+)")
jjui.jj_async(
    trunk and { "git", "fetch", "--branch", trunk } or { "git", "fetch" }
)
jjui.jj_async({ "rebase", "-s", "roots(trunk()..@)", "-d", "trunk()" })
jjui.revisions.refresh({ keep_selections = true })
'''

[[bindings]]
key = "d"
action = "diffview"
scope = "revisions"
desc = "edit diff"

[[bindings]]
key = "C"
action = "copy_change_id"
scope = "revisions"
desc = "copy change ID"

[[bindings]]
key = "F"
action = "forget_workspace"
scope = "revisions"
desc = "forget workspace"

[[bindings]]
key = "ctrl+r"
action = "refresh"
scope = "revisions"
desc = "refresh (snapshot all workspaces)"

[[bindings]]
key = "G"
action = "up"
scope = "revisions"
desc = "fetch & rebase onto trunk"

